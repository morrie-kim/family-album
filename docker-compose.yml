# 가족앨범 + PostgreSQL + Cloudflare Tunnel
#   docker compose --profile named up -d --build   # 고정 도메인(Cloudflare 계정·도메인 필요)
#   docker compose --profile quick up -d --build   # 임시 주소(trycloudflare.com, 계정 불필요)
# 자세한 절차: docs/DEPLOY-CLOUDFLARE.md
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyalbum
      POSTGRES_USER: familyalbum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyalbum -d familyalbum"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod            # Swagger 비노출, Secure 쿠키
      DB_URL: jdbc:postgresql://postgres:5432/familyalbum
      DB_USERNAME: familyalbum
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # prod 기본값은 validate 인데 스키마 마이그레이션 도구가 아직 없어 첫 기동에 테이블을 만들도록 update 사용
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      PHOTO_STORAGE_ROOT: /data/photos
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      ALLOW_NEW_FAMILY: ${ALLOW_NEW_FAMILY:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_TOKEN_KEY: ${GOOGLE_TOKEN_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    volumes:
      - photos:/data/photos
    ports:
      - "127.0.0.1:8080:8080"                 # 로컬 확인용. 외부 공개는 아래 터널로만

  # 고정 도메인: Zero Trust 대시보드에서 만든 터널 토큰으로 실행 (공개 호스트명 → http://app:8080)
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["named"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN 을 .env 에 설정하세요}
    depends_on:
      - app

  # 임시 주소: 기동 때마다 https://<임의>.trycloudflare.com 이 새로 발급됨(로그에서 확인)
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    profiles: ["quick"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:8080
    depends_on:
      - app

volumes:
  pgdata:
  photos:
