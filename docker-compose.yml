# 가족앨범 + PostgreSQL + Cloudflare Tunnel
# 로컬 빌드: docker compose --profile named up -d --build
# VPS 배포: GitHub Actions가 APP_IMAGE를 .env에 설정하고 이미지 pull/up 수행
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyalbum
      POSTGRES_USER: familyalbum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyalbum -d familyalbum"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    image: ${APP_IMAGE:-familyalbum:local}
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/familyalbum
      DB_USERNAME: familyalbum
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      PHOTO_STORAGE_ROOT: /data/photos
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      ALLOW_NEW_FAMILY: ${ALLOW_NEW_FAMILY:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_TOKEN_KEY: ${GOOGLE_TOKEN_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    volumes:
      - photos:/data/photos
    ports:
      - "127.0.0.1:8080:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["named"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN 을 .env 에 설정하세요}
    depends_on:
      - app

  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    profiles: ["quick"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:8080
    depends_on:
      - app

volumes:
  pgdata:
  photos:
