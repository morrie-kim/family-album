<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title th:text="${title}">가족앨범</title>
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<!-- 아이콘 스프라이트: Outlined, 1.5px stroke -->
<svg th:fragment="sprite" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M17 14.2c2.4.2 4 2.1 4 4.8"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v2.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V16"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H6a2 2 0 00-2 2v12a2 2 0 002 2h3"/><path d="M16 8l4 4-4 4"/><path d="M20 12H9"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5A2 2 0 015.5 5.5h3.2l2 2.2h7.8a2 2 0 012 2v7.8a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="8" cy="17" r="1.8"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 01-.6-7.96A5.5 5.5 0 0117.2 8.6 4.5 4.5 0 0117.5 18H7z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 01-8 0V4z"/><path d="M8 6H5.5A1.5 1.5 0 004 7.5 3.5 3.5 0 007.5 11H8M16 6h2.5A1.5 1.5 0 0120 7.5 3.5 3.5 0 0116.5 11H16"/><path d="M12 13v4M8.5 20h7M10 17h4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 9V6.5A2.5 2.5 0 0012.5 4h-6A2.5 2.5 0 004 6.5v6A2.5 2.5 0 006.5 15H9"/></symbol>
</svg>

<!-- 상단 바 (56px, blur) -->
<header th:fragment="topbar(me, active)" class="topbar">
    <a class="brand" th:href="@{/photos}">
        <span class="logo"><svg class="icon"><use href="#i-photo"/></svg></span>가족앨범
    </a>
    <nav class="toplinks" aria-label="주 메뉴">
        <a th:href="@{/photos}" th:attr="aria-current=${active == 'photos' ? 'page' : null}">사진</a>
        <a th:href="@{/family}" th:attr="aria-current=${active == 'family' ? 'page' : null}">가족</a>
        <a th:href="@{/worldcups}" th:attr="aria-current=${active == 'worldcup' ? 'page' : null}">월드컵</a>
        <a th:href="@{/google}" th:attr="aria-current=${active == 'google' ? 'page' : null}">구글 포토</a>
    </nav>
    <span class="spacer"></span>
    <span class="who" th:text="${me.name()}">이름</span>
    <form th:action="@{/logout}" method="post" class="inline logout-top">
        <button type="submit" class="btn ghost sm">로그아웃</button>
    </form>
</header>

<!-- 하단 탭 (모바일, 56px) -->
<nav th:fragment="tabbar(active)" class="tabbar" aria-label="하단 메뉴">
    <a th:href="@{/photos}" th:attr="aria-current=${active == 'photos' ? 'page' : null}">
        <svg class="icon"><use href="#i-photo"/></svg>사진</a>
    <a th:href="@{/family}" th:attr="aria-current=${active == 'family' ? 'page' : null}">
        <svg class="icon"><use href="#i-users"/></svg>가족</a>
    <a th:href="@{/worldcups}" th:attr="aria-current=${active == 'worldcup' ? 'page' : null}">
        <svg class="icon"><use href="#i-trophy"/></svg>월드컵</a>
    <a th:href="@{/google}" th:attr="aria-current=${active == 'google' ? 'page' : null}">
        <svg class="icon"><use href="#i-cloud"/></svg>구글 포토</a>
    <form th:action="@{/logout}" method="post">
        <button type="submit"><svg class="icon"><use href="#i-logout"/></svg>로그아웃</button>
    </form>
</nav>

<!-- 월드컵 후보 썸네일(사진 또는 텍스트) -->
<div th:fragment="wcThumb(e)" class="wc-thumb">
    <img th:if="${e.hasPhoto()}" th:src="@{/photos/{id}/file(id=${e.photoId()})}" th:alt="${e.displayName()}" loading="lazy" decoding="async">
    <span th:unless="${e.hasPhoto()}" class="wc-text" th:text="${e.displayName()}">후보</span>
</div>

<!-- 월드컵 대진 선택 카드: 누르면 바로 선택 -->
<form th:fragment="wcChoice(e, action)" th:action="${action}" method="post" class="choice-form">
    <input type="hidden" name="winnerId" th:value="${e.id()}">
    <button type="submit" class="choice" th:attr="aria-label=${e.displayName()} + ' 선택'">
        <span class="media" th:if="${e.hasPhoto()}"><img th:src="@{/photos/{id}/file(id=${e.photoId()})}" th:alt="${e.displayName()}" decoding="async"></span>
        <span class="text-only" th:unless="${e.hasPhoto()}" th:text="${e.displayName()}">후보</span>
        <span class="name" th:if="${e.hasPhoto() and !e.displayName().isEmpty()}" th:text="${e.displayName()}">이름</span>
    </button>
</form>

<!-- 토스트(플래시 메시지) -->
<div th:fragment="toasts" class="toasts" aria-live="polite">
    <div class="toast" role="status" th:if="${message}" th:text="${message}"></div>
    <div class="toast error" role="alert" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
