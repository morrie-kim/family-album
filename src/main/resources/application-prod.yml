# 운영: SPRING_PROFILES_ACTIVE=prod
# Render Free 기본 구성은 H2 파일 DB를 사용합니다.
# DB_URL을 별도로 지정하면 PostgreSQL 등 JDBC URL로 전환할 수 있습니다.
server:
  servlet:
    session:
      cookie:
        secure: true
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:/tmp/family-album;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  thymeleaf:
    cache: true

# 운영에서는 API 문서/Swagger UI 를 등록하지 않는다 (엔드포인트 자체가 존재하지 않음 → 404)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
