# 운영: SPRING_PROFILES_ACTIVE=prod
# 무료 Render 환경은 별도 마이그레이션 도구 없이 신규 DB를 구성하므로 update를 사용합니다.
# 스키마 변경 후에는 백업/검증을 권장합니다.
server:
  servlet:
    session:
      cookie:
        secure: true
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  thymeleaf:
    cache: true

# 운영에서는 API 문서/Swagger UI 를 등록하지 않는다 (엔드포인트 자체가 존재하지 않음 → 404)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
