name: Validate Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript
        run: node --check src/worker/index.js
      - name: Check local startup script
        run: bash -n scripts/cloudflare-worker-up.sh
      - name: Validate Wrangler bundle
        run: npx --yes wrangler@4 deploy --dry-run
