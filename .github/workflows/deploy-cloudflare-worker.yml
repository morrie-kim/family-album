name: Deploy Family Album to Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      backend_origin:
        description: "HTTPS origin of the currently running Spring Boot Quick Tunnel (e.g. https://xxxx.trycloudflare.com)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        env:
          BACKEND_ORIGIN: ${{ inputs.backend_origin }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          node -e 'const u=new URL(process.env.BACKEND_ORIGIN); if(u.protocol!=="https:" || u.username || u.password || u.pathname!=="/" || u.search || u.hash) process.exit(1);'
          node --check src/worker/index.js

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKEND_ORIGIN: ${{ inputs.backend_origin }}
        run: |
          npx --yes wrangler@4 deploy --var "BACKEND_ORIGIN:$BACKEND_ORIGIN"

      - name: Verify public Worker
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused https://family-album.nhacker7k.workers.dev/ -o /dev/null
          echo "Cloudflare Worker root endpoint returned HTTP 200."
